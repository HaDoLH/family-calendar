name: 每日行程推播

on:
  schedule:
    # ⚠️ 不要在這裡指定「幾點送」。GitHub 的排程觸發實測會延遲 6～12 小時
    #    （說好 09:00，實際 16:00 才跑），所以指定時間毫無意義。
    #    改成每 30 分鐘叫一次，由 notify.js 看台北時間自己決定該不該送。
    - cron: '*/30 * * * *'
  # 手動觸發，測試時不用等
  workflow_dispatch:
    inputs:
      mode:
        description: 要推哪一天
        type: choice
        default: today
        options: [today, tomorrow, auto]

# 同時只跑一個，避免排程延遲時重疊送出重複通知
concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 web-push
        run: npm install --no-audit --no-fund

      - name: 決定模式
        id: pick
        run: |
          # 排程一律交給 notify.js 自己判斷時段；只有手動觸發才指定
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: 送出推播
        env:
          FAMILY_CODE:       ${{ secrets.FAMILY_CODE }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT:     ${{ secrets.VAPID_SUBJECT }}
          # 公開金鑰不是機密，直接寫在這裡（也存在 index.html 裡，兩邊要一致）
          VAPID_PUBLIC_KEY: 'BNMFwjnt8uM8bMhSP4KgzUOwvN6OAosgeNM8nG6OSLw5qBYJENhSpavjo9uj60bepn_35tSLfrYWy9jzT61wki0'
        run: node scripts/notify.js "${{ steps.pick.outputs.mode }}"
